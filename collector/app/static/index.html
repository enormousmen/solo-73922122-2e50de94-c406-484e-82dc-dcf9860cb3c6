<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>仪器 CSV 采集归档</title>
<style>
  :root { --line:#e3e6ea; --ink:#24292f; --mut:#6a737d; --bg:#f6f8fa; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; color:var(--ink); background:var(--bg); }
  header { background:#1f6feb; color:#fff; padding:14px 22px; }
  header h1 { margin:0; font-size:18px; font-weight:600; }
  header .sub { opacity:.85; font-size:12px; margin-top:2px; }
  main { max-width:1180px; margin:18px auto; padding:0 16px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:8px; padding:14px 16px; margin-bottom:16px; }
  .row { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  button { background:#1f6feb; color:#fff; border:0; border-radius:6px; padding:8px 16px; font-size:14px; cursor:pointer; }
  button:hover { background:#1a5fd0; }
  button.ghost { background:#fff; color:#1f6feb; border:1px solid #1f6feb; }
  button.warn { background:#fff; color:#b35900; border:1px solid #b35900; }
  button:disabled { opacity:.5; cursor:default; }
  table { width:100%; border-collapse:collapse; }
  th,td { text-align:left; padding:7px 9px; border-bottom:1px solid var(--line); vertical-align:middle; }
  th { color:var(--mut); font-weight:600; font-size:12px; white-space:nowrap; }
  .mut { color:var(--mut); font-size:12px; }
  .badge { display:inline-block; padding:2px 9px; border-radius:11px; font-size:12px; color:#fff; white-space:nowrap; }
  .bar { width:110px; height:8px; background:#eaecef; border-radius:4px; overflow:hidden; display:inline-block; vertical-align:middle; }
  .bar > i { display:block; height:100%; background:#1f6feb; }
  .mono { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12px; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; }
  .spin { animation:pulse 1s infinite; }
  @keyframes pulse { 50% { opacity:.25; } }
  .err { color:#b35900; font-size:12px; max-width:220px; word-break:break-all; }
  a.dl { color:#1f6feb; text-decoration:none; font-weight:600; }
  a.dl:hover { text-decoration:underline; }
  .brow { cursor:pointer; }
  .brow:hover td, .brow.sel td { background:#eef4ff; }
  h2 { font-size:15px; margin:4px 0 10px; }
  #toast { position:fixed; top:14px; right:14px; background:#24292f; color:#fff; padding:9px 14px; border-radius:6px; opacity:0; transition:opacity .2s; max-width:46em; font-size:13px; }
</style>
</head>
<body>
<header>
  <h1>仪器 CSV 采集归档</h1>
  <div class="sub" id="srcinfo">源：加载中…（源地址由部署配置固定，仅经 SFTP 操作）</div>
</header>
<main>
  <div class="card">
    <div class="row">
      <button id="btnCollect" onclick="triggerCollect()">开始采集</button>
      <button class="warn" id="btnCrash" onclick="armCrash()">武装「认领后退出」演示</button>
      <span id="runstate" class="mut"></span>
    </div>
    <div class="mut" style="margin-top:8px">
      单进程同时只采一轮；采集中重复点击「开始采集」只返回当前进度，不会并发。
      「待清理」表示远端认领件删除失败，已发布原件仍可下载，系统会自动重试删除。
    </div>
  </div>

  <div class="card">
    <h2 id="batchTitle">当前批次</h2>
    <div id="batchMeta" class="mut" style="margin-bottom:8px"></div>
    <table>
      <thead><tr>
        <th>ID</th><th>文件名</th><th>大小</th><th>进度</th><th>状态</th>
        <th>SHA-256</th><th>错误</th><th>操作</th>
      </tr></thead>
      <tbody id="files"><tr><td colspan="8" class="mut">暂无数据</td></tr></tbody>
    </table>
  </div>

  <div class="card">
    <h2>批次历史（点击行查看该批次文件）</h2>
    <table>
      <thead><tr><th>批次</th><th>来源</th><th>开始时间</th><th>结束时间</th><th>状态</th><th>文件数</th></tr></thead>
      <tbody id="batches"><tr><td colspan="6" class="mut">暂无数据</td></tr></tbody>
    </table>
  </div>
</main>
<div id="toast"></div>

<script>
const ST = {
  claiming:        ['认领中',        '#8a6d3b'],
  claimed:         ['已认领',        '#31708f'],
  downloading:     ['下载中',        '#1f6feb'],
  published:       ['已发布·待删远端','#6f42c1'],
  cleanup_pending: ['待清理',        '#b35900'],
  archived:        ['已归档',        '#2da44e'],
  lost:            ['源缺失',        '#777777'],
  failed:          ['失败',          '#cf222e'],
};
let selectedBatch = null;   // null = 跟随最新批次
let lastSig = '';

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.opacity = 1;
  setTimeout(() => t.style.opacity = 0, 2600);
}
function fmtSize(n) {
  if (n === null || n === undefined) return '—';
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n/1024).toFixed(1) + ' KB';
  return (n/1048576).toFixed(2) + ' MB';
}
function fmtTime(s) { return s ? s.replace('T',' ').slice(0,19) + 'Z' : '—'; }
function badge(st) {
  const [label, color] = ST[st] || [st, '#666'];
  return `<span class="badge" style="background:${color}">${label}</span>`;
}

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error((await r.json().catch(()=>({}))).detail || r.statusText);
  return r.json();
}

async function triggerCollect() {
  try {
    const d = await api('/api/collect', {method:'POST'});
    toast(d.started ? `已启动第 ${d.batch_id} 轮采集` : '已有采集轮次在进行中，返回当前进度');
    refresh();
  } catch (e) { toast('触发失败: ' + e.message); }
}
async function armCrash() {
  try {
    await api('/api/demo/crash-after-claim', {method:'POST'});
    toast('已武装：下一轮采集将在「认领完成、尚未下载」时退出进程，随后由容器自动重启续办');
    refresh();
  } catch (e) { toast(e.message); }
}

function renderFiles(files) {
  const tb = document.getElementById('files');
  if (!files.length) { tb.innerHTML = '<tr><td colspan="8" class="mut">该批次没有文件</td></tr>'; return; }
  tb.innerHTML = files.map(f => {
    const pct = f.size ? Math.min(100, Math.round(100 * (f.bytes_done||0) / f.size)) : (f.bytes_done ? 100 : 0);
    const bar = `<span class="bar"><i style="width:${pct}%"></i></span> <span class="mut">${pct}%</span>`;
    const sha = f.sha256 ? `<span class="mono">${f.sha256.slice(0,12)}…</span>` : '—';
    const err = f.error ? `<div class="err">${f.error}</div>` : '';
    const dl = f.downloadable
      ? `<a class="dl" href="/api/files/${f.id}/download" download>下载原件</a>` : '<span class="mut">—</span>';
    return `<tr><td>${f.id}</td><td class="mono">${f.filename}</td><td>${fmtSize(f.size)}</td>
      <td>${bar}</td><td>${badge(f.status)}</td><td>${sha}</td><td>${err}</td><td>${dl}</td></tr>`;
  }).join('');
}

function renderBatches(list) {
  const tb = document.getElementById('batches');
  if (!list.length) { tb.innerHTML = '<tr><td colspan="6" class="mut">暂无批次</td></tr>'; return; }
  tb.innerHTML = list.map(b => `
    <tr class="brow ${selectedBatch===b.id?'sel':''}" onclick="selectBatch(${b.id})">
      <td>#${b.id}</td><td class="mut">${b.note||'—'}</td>
      <td class="mono">${fmtTime(b.started_at)}</td><td class="mono">${fmtTime(b.finished_at)}</td>
      <td>${b.status==='running'?'<span class="dot spin" style="background:#1f6feb"></span>进行中':'已完成'}</td>
      <td>${b.file_count}</td></tr>`).join('');
}

async function selectBatch(id) {
  selectedBatch = id;
  const d = await api(`/api/batches/${id}/files`);
  document.getElementById('batchTitle').textContent = `批次 #${id} 文件`;
  document.getElementById('batchMeta').textContent = '';
  renderFiles(d.files);
  refresh(true);
}

async function refresh(skipFiles) {
  try {
    const d = await api('/api/progress');
    document.getElementById('runstate').innerHTML =
      (d.running ? '<span class="dot spin" style="background:#1f6feb"></span>采集/续办进行中'
                 : '<span class="dot" style="background:#2da44e"></span>空闲') +
      (d.crash_armed ? '　<span class="badge" style="background:#b35900">崩溃演示已武装</span>' : '');
    renderBatches(d.batches);
    if (!skipFiles) {
      const bid = selectedBatch ?? (d.batch ? d.batch.id : null);
      if (bid !== null && d.batch && bid === d.batch.id) {
        document.getElementById('batchTitle').textContent = `批次 #${bid} 文件` + (d.running ? '（实时）' : '');
        const c = Object.entries(d.counts).map(([k,v]) => `${(ST[k]||[k])[0]} ${v}`).join(' · ');
        document.getElementById('batchMeta').textContent =
          `开始 ${fmtTime(d.batch.started_at)}　结束 ${fmtTime(d.batch.finished_at)}　${c}`;
        renderFiles(d.files);
      } else if (bid !== null) {
        const f = await api(`/api/batches/${bid}/files`);
        renderFiles(f.files);
      }
    }
  } catch (e) { /* 采集器可能正在重启（崩溃演示），下轮自动恢复 */ }
}

(async () => {
  try {
    const c = await api('/api/config');
    document.getElementById('srcinfo').textContent =
      `源：sftp://${c.sftp_user}@${c.sftp_host}:${c.sftp_port}${c.drop_dir}（认领目录 ${c.claim_dir}，仅经 SFTP 操作）`;
  } catch (e) {}
  refresh();
  setInterval(refresh, 1500);
})();
</script>
</body>
</html>
